<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* =========================================
   JAISON PURPLE WATER GLOW
========================================= */

    body {
      position: relative;
      background: #030303;
      overflow-x: hidden;
    }

    /* Moving purple water light */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(100px);
      opacity: 0.18;
    }

    /* Main flowing purple glow */
    body::before {
      background:
        radial-gradient(ellipse at center,
          rgba(138, 43, 226, 0.8),
          rgba(75, 0, 130, 0.35),
          transparent 70%);

      top: -300px;
      left: -300px;

      animation: purpleWaterOne 14s ease-in-out infinite;
    }

    /* Second wave */
    body::after {
      background:
        radial-gradient(ellipse at center,
          rgba(180, 70, 255, 0.65),
          rgba(75, 0, 130, 0.25),
          transparent 70%);

      bottom: -350px;
      right: -300px;

      animation: purpleWaterTwo 18s ease-in-out infinite;
    }


    /* =========================================
   FLOWING WATER MOVEMENT
========================================= */

    @keyframes purpleWaterOne {

      0% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(180px, 80px) scale(1.15);
      }

      50% {
        transform: translate(350px, -50px) scale(1);
      }

      75% {
        transform: translate(120px, 180px) scale(1.2);
      }

      100% {
        transform: translate(0, 0) scale(1);
      }

    }


    @keyframes purpleWaterTwo {

      0% {
        transform: translate(0, 0) scale(1);
      }

      30% {
        transform: translate(-180px, -100px) scale(1.2);
      }

      60% {
        transform: translate(-350px, 50px) scale(1);
      }

      80% {
        transform: translate(-100px, -150px) scale(1.15);
      }

      100% {
        transform: translate(0, 0) scale(1);
      }

    }

    /* =========================================
   JAISON PURPLE ELEMENT GLOW
========================================= */

    .purple {
      color: #b84cff;
      text-shadow:
        0 0 5px rgba(138, 43, 226, 0.5),
        0 0 15px rgba(138, 43, 226, 0.35);
    }

    button.projects,
    .send-btn {
      box-shadow:
        0 0 8px rgba(138, 43, 226, 0.35),
        0 0 25px rgba(138, 43, 226, 0.18);

      transition: 0.3s ease;
    }

    button.projects:hover,
    .send-btn:hover {
      box-shadow:
        0 0 12px rgba(138, 43, 226, 0.8),
        0 0 35px rgba(138, 43, 226, 0.5),
        0 0 70px rgba(138, 43, 226, 0.25);

      transform: translateY(-3px);
    }

    /* =========================================
   FLOWING PURPLE LINES
========================================= */

    .intro-line {
      position: relative;
      height: 2px;
      width: 220px;
      margin: 25px auto;

      background: linear-gradient(90deg,
          transparent,
          #8a2be2,
          #c56cff,
          #8a2be2,
          transparent);

      background-size: 200% 100%;

      animation: lineWave 4s linear infinite;

      box-shadow:
        0 0 8px #8a2be2,
        0 0 20px rgba(138, 43, 226, 0.6);
    }

    @keyframes lineWave {

      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }

    }

    body { animation: mySlide;
       /* Specifie ur animation property */ 
       animation-play-state: running; animation-delay: 0s; /* *begin after */ 
       animation-timing-function: linear; /* ease-in = eccelerate but doesn't slowdown ease-out = get in quickly and desolorate ease = will do both linear = constant */ 
       animation-iteration-count: infinite; /* *repeat-it will lope */ 
       animation-duration: 9s; /* *time */ /* duration, timming function, delay, iteration-count, play-state, animation */ 
       animation: 9s linear 0s infinite running myColorChange; } /* change the Colors */ 
       @keyframes myColorChange{ 
        10%{background-color: red;} 
        20%{background-color: orange;} 
        40%{background-color: pink} 
        60%{background-color: green;} 
        80%{background-color: blue;} 
        100%{background-color: purple;} 
      }
  </style>

</head>

<body>
  <div id="box1">Lwarh </div>
</body>

</html>
